# nginx config for the Coglass sales site container (copied in by the Dockerfile).
# TLS is terminated by the proxy in front; this server only ever sees plain HTTP.

# coglass.net is the main (international) site. Every other public host forwards
# page-for-page to the same path on https://coglass.net:
#   www.coglass.net, coglass.co.uk, www.coglass.co.uk  ->  https://coglass.net$request_uri
# Exception: the Google Search Console verification file stays servable on every host, so the
# coglass.co.uk property stays verified for Search Console's Change of Address tool.
# Any other host (localhost, an IP, a preview URL) is served directly, so local testing works.
# (Before this change the direction was the reverse: coglass.net -> coglass.co.uk.)
map "$host:$uri" $to_coglass_net {
    default 0;
    "~^coglass\.net:" 0;
    "~^[^:]+:/google889231835aa3c68a\.html$" 0;
    "~*^(www\.coglass\.net|(www\.)?coglass\.co\.uk):" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects stay relative, so /pricing → /pricing/ keeps https and the public host
    # (without this nginx built "http://coglass.co.uk:80/pricing/").
    absolute_redirect off;

    # One canonical host: https://coglass.net (see the map above).
    if ($to_coglass_net) {
        return 301 https://coglass.net$request_uri;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://hq.coglass.app; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Build sources, deploy files and docs are not part of the site.
    location ~ ^/(_src/|\.git|Dockerfile|nginx\.conf|\.dockerignore|.*\.md$) { return 404; }

    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
