# nginx config for the coglass.co.uk container (copied in by the Dockerfile).
# TLS is terminated by the proxy in front; this server only ever sees plain HTTP.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects stay relative, so /pricing → /pricing/ keeps https and the public host
    # (without this nginx built "http://coglass.co.uk:80/pricing/").
    absolute_redirect off;

    # One canonical host.
    if ($host = www.coglass.co.uk) {
        return 301 https://coglass.co.uk$request_uri;
    }
    # coglass.net is held for the future international site; until then every
    # .net address forwards page-for-page to the same page on coglass.co.uk.
    if ($host ~* ^(www\.)?coglass\.net$) {
        return 301 https://coglass.co.uk$request_uri;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://hq.coglass.app; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Build sources, deploy files and docs are not part of the site.
    location ~ ^/(_src/|\.git|Dockerfile|nginx\.conf|\.dockerignore|.*\.md$) { return 404; }

    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
